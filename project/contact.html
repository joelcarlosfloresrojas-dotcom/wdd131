<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discovering Cuzco - Contact Us Page - Joel Flores</title>
    <meta name="description" content="Get in touch with Discovering Cuzco and learn more about our travel experiences in Cuzco, Peru.">
    <meta name="author" content="Joel Flores">
    <link rel="stylesheet" href="styles/contact.css">
    <script src="scripts/contact.js" defer></script>
</head>
<body>
      <header>
        <img src="../images/logo.jpg" alt="Discovering Cuzco Logo" height="100" width="100">
        <nav>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="experiences.html">Experiences</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <form method="get" action="review.html">
            <fieldset>
                <legend>Information</legend>
                <label for="fname">First Name*</label>
                <input type="text id="fname" required>
                <label for="lname">Last Name*</label>
                <input type="text" id="lname" required>
                <label for="email">e-mail*</label>
                <input type="email" id="email" required>
                <label for="number">Phone Number*</label>
                <input type="tel" id="number" required>
            </fieldset>
            <fieldset>
            <legend>Message Purpose</legend>
            
            <div>
                <input type="radio" name="purpose" value="general" id="purpose-general" required>
                <label for="purpose-general">General Inquiry</label>
            </div>
            
            <div>
                <input type="radio" name="purpose" value="booking" id="purpose-booking">
                <label for="purpose-booking">Trip Booking</label>
            </div>
            
            <div>
                <input type="radio" name="purpose" value="custom" id="purpose-custom">
                <label for="purpose-custom">Custom Tours & Group Travel</label>
            </div>
            
            <div>
                <input type="radio" name="purpose" value="feedback" id="purpose-feedback">
                <label for="purpose-feedback">Feedback & Support</label>
            </div>
        </fieldset>
        <div class="hidden1">
        <label for="general">General Inquiry</label>
        <textarea name="general" id="inquiry" cols="30" rows="10"></textarea>
        </div>
        <div class="hidden2">
        <label for="general">General Inquiry</label>
        <textarea name="general" id="inquiry" cols="30" rows="10"></textarea>
        </div>
        <div class="hidden3">
        <label for="tour"></label> 
        <select name="tour" id="tourist" required>
                <option value="" id="placeholder" disabled selected>Select an option</option>

        </select> 
        </div>
        <div class="hidden4">
        <label for="feedback">General Inquiry</label>
        <textarea name="feedback" id="support" cols="30" rows="10"></textarea>
        </div>

        </form>
    </main>

    <footer>
        <p>&copy;Joel Flores Rojas Peru <span id="currentyear"></span> </p>
        <p id="lastModified"></p>
    </footer>



</body>
</html>
