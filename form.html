<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form - Joel Flores</title>
    <meta name="author" content="Joel Flores">
    <meta name="description" content="This is Product Review Form designed by Joel Flores to help the user choose what he wants and rate it.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">
    <link rel="icon" href="data:,">
    <script src="scripts/form.js" defer></script>
</head> 
<body>
    <header>
        <h1>Product Review Form</h1>
    </header>
    <main>
        <form method="get" action="review.html">
        <div class="flexer">
            <label for="product-name">Product Name:</label>  
            <select name="product-name" id="product-name" required>
                <option value="" id="placeholder" disabled selected>Select a Product...</option>
            </select>   
        </div>
        <div>
            <label>Overall Rating:</label>
            <div class="fixer">
                <div class="flexer1">
                <label for="rating-1">☆</label>
                <input type="radio" name="rating" value="1" id="rating-1" required>
                </div>
                <div class="flexer1">
                <label for="rating-2">☆☆</label>
                <input type="radio" name="rating" value="2" id="rating-2"    required>
                </div>
                <div class="flexer1">
                <label for="rating-3">☆☆☆</label>
                <input type="radio" name="rating" value="3" id="rating-3" required>
                </div>
                <div class="flexer1">
                <label for="rating-4">☆☆☆☆</label>
                <input type="radio" name="rating" value="4" id="rating-4" required>
                </div>
                <div class="flexer1">
                <label for="rating-5">☆☆☆☆☆</label>
                <input type="radio" name="rating" value="5" id="rating-5" required>
                </div>
            </div>
        </div>
            <div class="flexer">
                <label for="installation-date">Date of Installation</label>
                <input type="date" name="installation-date" id="installation-date" required>
            </div>
            <div>Which features do find useful on this product?</div>
            <div>(check all that apply)</div>
           <div class="fixer1">
                <div>
                    <input type="checkbox" name="features" value="durability" id="feature-durability">
                    <label for="feature-durability">Durability</label>
                </div>
                <div>
                    <input type="checkbox" name="features" value="ease-of-use" id="feature-ease">
                    <label for="feature-ease">Ease of use</label>
                </div>
                <div>
                    <input type="checkbox" name="features" value="performance" id="feature-performance">
                    <label for="feature-performance">Performance</label>
                </div>
                <div>
                    <input type="checkbox" name="features" value="design" id="feature-design">
                    <label for="feature-design">Design</label>
                </div>
            </div>
        <div class="flexer">
            <label for="written-review">Written review (optional)</label>
            <textarea name="written-review" id="written-review" cols="30" rows="10" placeholder="Write your review here..."></textarea>
        </div>
        <div class="flexer">
            <label for="name">Your Name (optional)</label>
            <input type="text" name="name" id="name" placeholder="Enter your name...">
        </div>
        <input type="submit" value="Post Review" id="submit-button">
    </form>
        
    <footer>
        <p>&copy; <span id="currentyear"></span>  Joel Flores Rojas  Peru</p>
        <p id="lastModified"></p>
    </footer>

    </main>
</body>
</html>
